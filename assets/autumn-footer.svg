    <style>
    .t { font: italic 600 26px Georgia, 'Palatino Linotype', serif; fill: #D9622B; }
    .s { font: 500 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #C27A45; letter-spacing: 3px; }
    .fall  { animation: fall linear infinite; }
    .sway  { animation: sway ease-in-out infinite alternate; }
    .spin  { animation: spin linear infinite; }
    @keyframes sway { from { transform: translateX(-28px); } to { transform: translateX(28px); } }
    @keyframes spin {
      0%   { transform: rotate(0deg)   scaleX(1); }
      50%  { transform: rotate(180deg) scaleX(-.45); }
      100% { transform: rotate(360deg) scaleX(1); }
    }
    @keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(150px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
